# =======================================================
#               CombatGuard Configuration
#       Next-Gen Anti-CombatLog & PvP Tagging Engine
# =======================================================

combat:
  # Tag duration in seconds when entering combat
  duration-seconds: 15

  # Whether hitting/getting hit by hostile mobs tags the player
  tag-on-mob-damage: false

  # Whether the attacker gets tagged
  tag-attacker: true

  # Whether the victim gets tagged
  tag-victim: true

  # Whether self-inflicted damage (fall, fire, potion) tags player
  tag-self-damage: false

  # Whether executing commands is blocked in combat
  block-commands: true

  # List of blocked commands (case-insensitive prefixes)
  blocked-commands:
    - "/spawn"
    - "/home"
    - "/tpa"
    - "/tpahere"
    - "/tpaccept"
    - "/tpdeny"
    - "/warp"
    - "/back"
    - "/heal"
    - "/feed"
    - "/fly"
    - "/gm"
    - "/gamemode"
    - "/craft"
    - "/workbench"
    - "/ec"
    - "/enderchest"
    - "/suicide"
    - "/hub"
    - "/lobby"

  # Instantly cancel elytra gliding and boost upon entering combat
  block-elytra: true

  # Instantly disable creative/fly mode upon entering combat
  block-flight: true

  # Block opening Ender Chest blocks or menus in combat
  block-ender-chest: true

  # Block stepping through Nether or End portals while tagged
  block-portals: true

  # Block Ender Pearl, Chorus Fruit, and plugin teleports in combat
  block-teleport: false

ui:
  # Adventure BossBar timer at top of screen
  bossbar:
    enabled: true
    title: "<gradient:#ff4444:#ffaa00>⚔ In Combat with %opponent%</gradient> <gray>(%time%s)</gray>"
    color: RED # RED, YELLOW, GREEN, PINK, PURPLE, BLUE, WHITE
    style: PROGRESS # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20

  # ActionBar timer above hotbar
  actionbar:
    enabled: true
    message: "<red><bold>⚔ IN COMBAT</bold></red> <gray>•</gray> <yellow>%time%s left</yellow> <gray>(Opponent: <white>%opponent%</white>)</gray>"

punish:
  # Punishment applied when player disconnects during combat
  # KILL = Player is instantly slain, dropping inventory and crediting opponent
  # COMMANDS_ONLY = Run console commands without slaying
  # NONE = No punishment
  mode: KILL

  # Broadcast death message across server when a player combat logs
  broadcast-death: true
  death-message: "<red><bold>☠</bold></red> <white>%victim%</white> <red>combat logged while fighting</red> <gold>%attacker%</gold><red>! Items dropped.</red>"

  # Optional console commands executed on combat log (supports %victim%, %attacker%)
  # Enable by uncommenting commands below:
  commands: []
  # - "eco take %victim% 250"

sounds:
  # Sound when tagged into combat
  tagged: "ENTITY_ENDER_DRAGON_GROWL"

  # Subtle periodic tick sound (plays every 2-3 seconds)
  tick: "UI_BUTTON_CLICK"

  # Sound when combat naturally expires
  expired: "ENTITY_PLAYER_LEVELUP"

  # Sound played to opponent when victim combat logs
  combat-log: "ENTITY_WITHER_SPAWN"

  # Sound when blocked action (command, elytra, echest) is attempted
  blocked: "BLOCK_NOTE_BLOCK_BASS"

messages:
  prefix: "<gradient:#ff3333:#ff7700>[CombatGuard]</gradient> "
  tagged: "<red>You have been tagged in combat for <white>%time%s</white>! Do not log out!</red>"
  expired: "<green>You are no longer in combat. You may now safely log out.</green>"
  blocked-command: "<red>You cannot use commands while in combat! <white>(%time%s left)</white></red>"
  blocked-elytra: "<red>Elytra flight is disabled during active combat!</red>"
  blocked-ender-chest: "<red>Opening Ender Chests is prohibited while in combat!</red>"
  blocked-portal: "<red>Portals are sealed while in combat!</red>"
  blocked-teleport: "<red>Teleportation is prohibited while in combat!</red>"
  not-in-combat: "<green>You are currently safe and not in combat.</green>"
  status: "<yellow>You are in combat with <white>%opponent%</white> for <gold>%time%s</gold>.</yellow>"
  admin-tagged: "<green>Forcefully tagged <white>%player%</white> into combat for <white>%time%s</white>.</green>"
  admin-untagged: "<green>Forcefully untagged <white>%player%</white> from combat.</green>"
  config-reloaded: "<green>CombatGuard configuration reloaded successfully.</green>"
